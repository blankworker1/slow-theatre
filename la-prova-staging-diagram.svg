<svg width="680" height="410" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Inside a Node: La Prova, four acts, the Transformation Station, and four satellite roles</title>
<desc>Four acts sit within the audience, aspetta-tori — the only part critical to a Node's function. Outside that boundary, the Transformation Station and four satellite roles are optional support, shown with no drawn connection between them.</desc>
<rect width="680" height="410" fill="#ffffff"/>
<rect x="40" y="65" width="580" height="161" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="60" y="88" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">aspetta-tori</text>
<text x="60" y="106" font-family="sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">the audience, present throughout</text>

<rect x="60" y="150" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="120" y="168" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">L'Usato</text>
<text x="120" y="186" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">no price</text>

<rect x="200" y="150" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="260" y="168" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">L'Arte</text>
<text x="260" y="186" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">on display</text>

<rect x="340" y="150" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="400" y="168" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">La Promessa</text>
<text x="400" y="186" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">a pledge</text>

<rect x="480" y="150" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="168" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Il Brindisi</text>
<text x="540" y="186" font-family="sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">shared drink</text>

<rect x="235" y="246" width="210" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="268" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">Transformation Station</text>

<rect x="40" y="310" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="105" y="328" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Remembrancer</text>
<text x="105" y="346" font-family="sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">records acts</text>

<rect x="180" y="310" width="160" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="260" y="328" font-family="sans-serif" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">Il Trasformatore</text>
<text x="260" y="346" font-family="sans-serif" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">creates artworks</text>

<rect x="350" y="310" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="425" y="328" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">Il Commerciante</text>
<text x="425" y="346" font-family="sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">repairs &amp; resells</text>

<rect x="510" y="310" width="126" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="573" y="328" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">La Sarta</text>
<text x="573" y="346" font-family="sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">mends &amp; alters</text>
</svg>
