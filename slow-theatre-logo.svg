<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Slow Theatre</title>
  <!-- Triangle sign: black border, yellow field, point down (pair of the Slow Money sign) -->
  <path d="M34 46 L466 46 L250 422 Z" fill="#F5C518" stroke="#111" stroke-width="36" stroke-linejoin="round"/>
  <!-- Two mirrored mask heads, facing each other across an empty space -->
  <g fill="#111">
    <path d="M162 95 H240 V162 L236 167 V240 H204 A42 42 0 0 1 162 198 Z"/>
    <path d="M338 95 H260 V162 L264 167 V240 H296 A42 42 0 0 0 338 198 Z"/>
  </g>
  <g fill="#F5C518">
    <!-- leaf-shaped eyes -->
    <path d="M-19 0 Q0 -13 19 0 Q0 13 -19 0 Z" transform="translate(194 130) rotate(-45)"/>
    <path d="M-19 0 Q0 -13 19 0 Q0 13 -19 0 Z" transform="translate(306 130) rotate(45)"/>
    <!-- mouths: tragedy (left), comedy (right) -->
    <path d="M172 222 Q197 170 230 200 Q201 186 172 222 Z"/>
    <path d="M270 196 Q299 242 328 204 Q302 226 270 196 Z"/>
  </g>
  <!-- Wordmark near the bottom point -->
  <text x="250" y="316" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#111" letter-spacing="0.5">SLOW</text>
</svg>
